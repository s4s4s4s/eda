# Меню восьмидневного цикла. Приходит от диетолога порциями — неделя за неделей,
# и присланное НЕ переписывает прежнее: каждая порция ложится отдельной
# РЕДАКЦИЕЙ со своей датой вступления в силу, а прошлые остаются здесь же. По
# ним человек ел, и заглянуть в прошлый день должно быть можно.
#
# Как выбирается блюдо на конкретную дату: берутся редакции, у которых from не
# позже этой даты, и среди них — самая свежая ИЗ ТЕХ, что описывает нужный день
# цикла. Редакция вправе описывать не все восемь дней: диетолог прислал дни 4-8,
# значит дни 1-3 продолжают браться из прежней редакции. Обязательство одно и
# проверяется при разборе: ПЕРВАЯ редакция описывает все дни цикла — иначе
# нашёлся бы день, на который меню не существует вовсе.
#
# Поле from у первой редакции не задано намеренно: когда именно она вступила в
# силу, никто не записал, и выдуманная дата была бы враньём. Такая редакция
# может быть только одна и только первой; у всех остальных from обязателен и
# строго возрастает.
#
# Идентификатор блюда (id) уникален ВНУТРИ редакции. Один и тот же id в разных
# редакциях — это намеренно: то же блюдо с новой раскладкой, и оценка, которую
# человек когда-то ему поставил, остаётся с ним. Блюдо, у которого поменялся
# состав, а не граммовка, получает новый id.
