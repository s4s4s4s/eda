  # Неделя от 4 сентября 2026. Прислана Сергеем Чесноковым 30.08.2026, дни 4-8.
  # Дни 1-3 этой недели не присылались — до их прихода они берутся из редакции
  # выше, и это видно в проверке меню, а не спрятано.
  #
  # Как читался исходный текст, одним правилом на всю редакцию:
  #   - where говорит, ГДЕ еда лежит в момент еды, а не под каким заголовком её
  #     назвал Сергей. В packet идёт весь «Пакетик на крышку», а с ним орехи,
  #     которые досыпают сверху, и шоколад «на сладкое» — их Александр кладёт
  #     сам. Масло для жарки и заправка салата — container: они прошли через
  #     готовку вместе с блюдом и отдельно уже не существуют;
  #   - крупы и бобовые записаны в СУХОМ весе, как их и даёт Сергей, — справочник
  #     тоже считает их сухими (fdcDescription: raw / dry);
  #   - масло, названное в нескольких блюдах одного приёма, сложено в одну
  #     строку: приём — это один контейнер, а не три тарелки;
  #   - «зелень» — отдельный продукт greens (петрушка), а не шпинат: раньше её
  #     молча подставляли шпинатом, и в этой редакции такого больше нет;
  #   - «3 яйца (~165 г)» записаны граммами, а не штуками: штука в справочнике
  #     50 г, и три штуки дали бы 150 г вместо присланных 165.
