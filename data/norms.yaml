# Источник всех чисел: Dietary Reference Intakes (DRI), Food and Nutrition Board,
# National Academies — сводные таблицы приложения J отчёта «Dietary Reference
# Intakes for Sodium and Potassium» (2019). Группа: мужчины 19–30 лет.
# Значения сверены по этим таблицам 30.08.2026 и правятся только по источнику.
#
# unit — НЕ второй источник правды о единице измерения, а контрольная сумма
# к первому (карте NUTRIENT_UNIT в src/core/types.ts): парсер (parseNorms в
# src/core/data.ts) обязан сверить unit каждой записи с NUTRIENT_UNIT[key] и
# упасть с ошибкой при расхождении или отсутствии поля. Единица amount и ul —
# всегда та, что в NUTRIENT_UNIT; unit её не задаёт, а лишь ловит рассинхрон
# при переносе числа из источника. Это не перестраховка: 30.08.2026 медь была
# записана в мкг (900 / 10000) при коде, который читает норму в мг, — расхождение
# в 1000 раз молчало, пока не было замечено глазами на экране недели.
#
# Поля нутриента:
#   amount     — суточная норма, число в единице из NUTRIENT_UNIT;
#   basis      — rda (рекомендуемая норма) либо ai (адекватное потребление);
#   unit       — единица amount/ul, ровно как в NUTRIENT_UNIT (г / мг / мкг);
#                обязательна, парсер сверяет её и падает при расхождении;
#   ul         — верхний безопасный предел, и ТОЛЬКО такой, который источник
#                относит к суммарному потреблению из всех источников. Предел,
#                заданный на добавки, обогащённые продукты или на отдельную
#                форму нутриента (магний из препаратов, синтетический ниацин,
#                фолиевая кислота, синтетический токоферол, готовый ретинол),
#                сюда НЕ записывается: приложение считает еду, и сравнивать её
#                сумму с таким пределом — сравнивать разное. Полоса покраснела
#                бы без основания. Сам факт существования предела в таких
#                случаях объясняется в note, чтобы его не «вернули для полноты»;
#   cdrr       — уровень снижения риска хронических болезней (только у натрия);
#   comparable — false означает «сравнивать суточную сумму приложения с этим
#                числом нельзя, процент не показывать»; по умолчанию true;
#   note       — оговорка к строке, её видит человек.
#
# ВАЖНО: нутриента нет в этом файле — значит нормы нет. Это не ноль и не повод
# что-то домысливать. Норм нет у следующих ключей, и вот почему: DRI не задаёт
# числовой нормы для общих сахаров (ограничение касается добавленных), для
# насыщенных и трансжиров и для холестерина сказано «как можно ниже», а для
# полиненасыщенных нормы заданы для отдельных кислот (линолевая и
# α-линоленовая — см. ниже), а не для их суммы. Для ЭПК и ДГК (epa, dha) DRI
# не задаёт ни RDA, ни AI — только качественные рекомендации, не число. Для
# ретинола (retinol, готовый витамин A) собственной нормы нет: норма задана
# на суммарный витамин A в RAE (см. vitA), а не на ретинол отдельно. Для
# каротиноидов (betaCarotene, alphaCarotene, betaCryptoxanthin, lycopene,
# luteinZeaxanthin) DRI норму не устанавливает — доказательной базы для
# числовой рекомендации по ним нет.

norms:
  fiber:
    amount: 38
    basis: ai
    unit: "г"
    note: "AI для мужчин 19–30 задан из расчёта 14 г на 1000 ккал; при цели 3200 ккал ориентир выше — около 45 г."

  linoleic:
    amount: 17
    basis: ai
    unit: "г"

  ala:
    amount: 1.6
    basis: ai
    unit: "г"

  calcium:
    amount: 1000
    basis: rda
    unit: "мг"
    ul: 2500

  iron:
    amount: 8
    basis: rda
    unit: "мг"
    ul: 45

  magnesium:
    amount: 400
    basis: rda
    unit: "мг"
    note: "Верхний предел 350 мг относится только к добавкам и лекарствам и не включает магний из еды и воды, поэтому к этому счётчику он неприменим."

  phosphorus:
    amount: 700
    basis: rda
    unit: "мг"
    ul: 4000

  potassium:
    amount: 3400
    basis: ai
    unit: "мг"

  sodium:
    amount: 1500
    basis: ai
    unit: "мг"
    cdrr: 2300
    note: "2300 мг — уровень снижения риска хронических болезней, а не предел безопасности: выше него рекомендуется снижать потребление."

  zinc:
    amount: 11
    basis: rda
    unit: "мг"
    ul: 40

  copper:
    amount: 0.9
    basis: rda
    unit: "мг"
    ul: 10

  manganese:
    amount: 2.3
    basis: ai
    unit: "мг"
    ul: 11

  selenium:
    amount: 55
    basis: rda
    unit: "мкг"
    ul: 400

  vitA:
    amount: 900
    basis: rda
    unit: "мкг"
    note: "Верхний предел DRI 3000 мкг/сут относится только к готовому витамину A (ретинолу), а не к сумме в RAE, которую задаёт эта норма и куда входят каротиноиды — их избыток не токсичен. Поэтому здесь предел не указан: ретинол в приложении показан отдельным нутриентом (retinol) без собственной нормы."

  vitC:
    amount: 90
    basis: rda
    unit: "мг"
    ul: 2000

  vitD:
    amount: 15
    basis: rda
    unit: "мкг"
    ul: 100

  vitE:
    amount: 15
    basis: rda
    unit: "мг"
    note: "Верхний предел 1000 мг здесь не указан: он относится к синтетическому альфа-токоферолу из добавок и обогащённых продуктов, а не к витамину E из еды."

  vitK:
    amount: 120
    basis: ai
    unit: "мкг"

  thiamin:
    amount: 1.2
    basis: rda
    unit: "мг"

  riboflavin:
    amount: 1.3
    basis: rda
    unit: "мг"

  niacin:
    amount: 16
    basis: rda
    unit: "мг"
    note: "Норма задана в ниациновых эквивалентах, включая синтез из триптофана, а справочник даёт готовый ниацин — покрытие по этой строке занижено. Верхний предел 35 мг здесь не указан: он относится к ниацину из добавок и обогащённых продуктов, а не к ниацину из еды."

  vitB6:
    amount: 1.3
    basis: rda
    unit: "мг"
    ul: 100

  folate:
    amount: 400
    basis: rda
    unit: "мкг"
    note: "Норма и справочник в одних единицах: обе величины — пищевые эквиваленты фолата (DFE), число берётся из строки «Folate, DFE» датасета. Верхний предел 1000 мкг здесь не указан: он относится к синтетической фолиевой кислоте из добавок и обогащённой муки, а не к фолату из еды."

  vitB12:
    amount: 2.4
    basis: rda
    unit: "мкг"

  pantothenic:
    amount: 5
    basis: ai
    unit: "мг"

  choline:
    amount: 550
    basis: ai
    unit: "мг"
    ul: 3500

  water:
    amount: 3700
    basis: ai
    unit: "г"
    comparable: false
    note: "AI — вся вода за сутки, включая напитки; приложение считает только воду в составе еды, а это примерно пятая часть. Процент по этой строке был бы неверным, поэтому он не показывается."
