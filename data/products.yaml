# Источник всех чисел: USDA FoodData Central, набор SR Legacy, релиз 2018-04.
# Числа на 100 г съедобной части в сыром виде, если в описании не сказано иное.
# Файл собирается скриптом scripts/build-products.mjs, руками не правится.
#
# pieceG/pieceSource и tbspG/tbspSource — граммы одной штуки/столовой ложки.
# source: fdc — взято из food_portion.csv датасета (см. fdcId и описание продукта),
# source: common — общепринятая мера, не из датасета.
#
# per100g: kcal — ккал, protein/fat/carbs — граммы.
# micro100g: те же 100 г сырого веса, тот же fdcId. Единицы измерения ниже.
# ВАЖНО: отсутствие поля в micro100g означает "в датасете нет строки для этого
# нутриента у этого продукта" — это НЕ ноль. Ноль пишется только если в
# food_nutrient.csv реально записан 0. Складывать отсутствующее поле как 0 нельзя.
# Единицы измерения (взяты из nutrient.csv, unit_name):
#   fiber: G (id 1079, "Fiber, total dietary")
#   sugar: G (id 2000, "Sugars, Total")
#   satFat: G (id 1258, "Fatty acids, total saturated")
#   monoFat: G (id 1292, "Fatty acids, total monounsaturated")
#   polyFat: G (id 1293, "Fatty acids, total polyunsaturated")
#   cholesterol: MG (id 1253, "Cholesterol")
#   linoleic: G (id 1269, "PUFA 18:2")
#   ala: G (id 1270, "PUFA 18:3")
#   epa: G (id 1278, "PUFA 20:5 n-3 (EPA)")
#   dha: G (id 1272, "PUFA 22:6 n-3 (DHA)")
#   calcium: MG (id 1087, "Calcium, Ca")
#   iron: MG (id 1089, "Iron, Fe")
#   magnesium: MG (id 1090, "Magnesium, Mg")
#   phosphorus: MG (id 1091, "Phosphorus, P")
#   potassium: MG (id 1092, "Potassium, K")
#   sodium: MG (id 1093, "Sodium, Na")
#   zinc: MG (id 1095, "Zinc, Zn")
#   copper: MG (id 1098, "Copper, Cu")
#   manganese: MG (id 1101, "Manganese, Mn")
#   selenium: UG (id 1103, "Selenium, Se")
#   vitA: UG (id 1106, "Vitamin A, RAE")
#   retinol: UG (id 1105, "Retinol")
#   vitC: MG (id 1162, "Vitamin C, total ascorbic acid")
#   vitD: UG (id 1114, "Vitamin D (D2 + D3)")
#   vitE: MG (id 1109, "Vitamin E (alpha-tocopherol)")
#   vitK: UG (id 1185, "Vitamin K (phylloquinone)")
#   thiamin: MG (id 1165, "Thiamin")
#   riboflavin: MG (id 1166, "Riboflavin")
#   niacin: MG (id 1167, "Niacin")
#   vitB6: MG (id 1175, "Vitamin B-6")
#   folate: UG (id 1190, "Folate, DFE")
#   vitB12: UG (id 1178, "Vitamin B-12")
#   pantothenic: MG (id 1170, "Pantothenic acid")
#   choline: MG (id 1180, "Choline, total")
#   betaCarotene: UG (id 1107, "Carotene, beta")
#   alphaCarotene: UG (id 1108, "Carotene, alpha")
#   betaCryptoxanthin: UG (id 1120, "Cryptoxanthin, beta")
#   lycopene: UG (id 1122, "Lycopene")
